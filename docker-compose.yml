services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - DATA_DIR=/data
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-500}
    volumes:
      - ./data:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - SITE_ADDRESS=${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    depends_on:
      - app

volumes:
  caddy_data:
